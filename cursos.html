<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="287049938.png" type="image/x-icon">
    <title>Cursos - Hydra</title>          
</head>
<body>
    
    <header>
        <div class="logo">
            <img src="Hydra Logo.png" alt="Logo Hydra">
            <h1 class="vilan">HYDRA</h1>
        </div>
        <nav>
            <a href="SobreNos.html">Quem Somos</a>
            <a href="">Hydra Cup</a>
            <a href="Index.html">Organização</a>
        </nav>
    </header>

    <main>
        <h1 class="vilan" style="text-align: center; font-size: 2.5rem;">Cursos e Treinamentos</h1>
        <p style="text-align: center;">Selecione uma área abaixo para acessar o material de estudo da nossa equipe.</p>

        <div class="menu-cursos">
            <button id="btn-montagem" onclick="mostrar('montagem', this)">Montagem</button>
            <button id="btn-programacao" onclick="mostrar('programacao', this)">Programação</button>
            <button id="btn-eletrica" onclick="mostrar('eletrica', this)">Elétrica</button>
        </div>

        <div id="inicio" style="text-align: center; margin-top: 50px;">
            <img src="Hydra Logo.png" alt="Hydra" style="width: 150px; opacity: 0.2; filter: grayscale(100%);">
        </div>

        <div id="conteudo" style="display: none;"></div>
    </main>
    
    <script>
    function mostrar(area, elementoClicado) {
        document.getElementById("inicio").style.display = "none";

        const botoes = document.querySelectorAll('.menu-cursos button');
        botoes.forEach(btn => btn.classList.remove('ativo'));

        elementoClicado.classList.add('ativo');

        const conteudo = document.getElementById("conteudo");
        conteudo.style.display = "block";

        if (area === "montagem") {
            conteudo.innerHTML = `
                <h2 class="vilan">Montagem Mecânica</h2>
                <p>Aprenda os conceitos básicos da montagem do robô, uso de ferramentas e estruturação do chassi.</p>
                <video controls width="100%" style="border-radius: 10px; margin-top: 20px; border: 1px solid #ff2a2a;">
                    <source src="videos/montagem.mp4" type="video/mp4">
                    Seu navegador não suporta vídeo.
                </video>
            `;
        }
        else if (area === "programacao") {
            conteudo.innerHTML = `
                <h2 class="vilan">Programação de Sistemas</h2>
                <p>Lógica de programação, introdução ao Java/Python e integração de código com o controle do robô.</p>
                <img src="img/programacao.png" alt="Programação" style="width: 100%; max-width: 600px; margin-top: 20px; border-radius: 10px;">
            `;
        }
        else if (area === "eletrica") {
            conteudo.innerHTML = `
                <h2 class="vilan">Elétrica e Eletrônica</h2>
                <p>Aprenda sobre o mapeamento de cabos, ligação de motores, RoboRIO, rádio e sensores.</p>
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin-top: 20px; border-radius: 10px; border: 1px solid #ff2a2a;">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                        src="https://www.youtube.com/embed/VIDEO_ID" 
                        allowfullscreen>
                    </iframe>
                </div>
            `;
        }
    }
    </script>
</body>
</html>
